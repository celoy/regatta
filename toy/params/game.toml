# Game parameters: candidate R (toy/params/candidate_r_rotating.toml) slowed down from a
# 1 Hz to a 0.75 Hz beat (Chris, 2026-11-20). Every rate is scaled by the same factor 0.75
# (pure time rescaling), so the dynamics per beat are those measured in Phase 1: a 90 deg
# turn in about 2 beats, 13 deg per beat of idle circling, the same heading per press phase.
# What changes: everything takes 4/3 longer, and a given timing error in ms is 3/4 as large
# a fraction of the beat. To change the beat, scale field_hz, hull_damping and v together
# (hull_damping and v are also set in the boat files, which override this file).
# Inertias normalised by I_m + I_h = 1.

field_hz = 0.75              # field frequency omega / (2 pi), Hz (45 beats per minute)
omega_over_omega0 = 2.0      # candidate R
hull_damping = 2.25          # candidate R's 3.0 /s at 1 Hz, times 0.75
inertia_ratio = 0.2          # I_m / I_h
alpha0_deg = 65.0            # candidate R
omega_s_over_omega = 4.0     # tiller natural frequency / field frequency
zeta = 0.5                   # tiller damping ratio
v = 1.125                    # boat speed, length units / s (1.5 at 1 Hz, times 0.75)
steps_per_second = 480       # dt = 1 / steps_per_second (640 steps per beat)
phi_deg = 0.0                # field axis (each course sets its own)
field_ellipticity = 1.0      # rotating field (two coil pairs in quadrature)
stop_ratio = 1.3             # soft stops at +- stop_ratio * alpha0
stop_stiffness_ratio = 0.0   # stop stiffness / k; 0 switches the stops off
