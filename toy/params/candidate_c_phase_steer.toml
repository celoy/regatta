# Candidate C (Phase 1 report): stable regime with a small stroke (grip near 1), where the
# press phase sets the heading continuously. Inertias normalised by I_m + I_h = 1.

field_hz = 1.0               # field frequency omega / (2 pi), Hz (one beat per period)
omega_over_omega0 = 1.5      # candidate C: just above the stability threshold (about 1.35)
hull_damping = 0.7           # gamma / (I_m + I_h), 1/s
inertia_ratio = 0.2          # I_m / I_h
alpha0_deg = 17.0            # candidate C: stroke giving a grip near 1
omega_s_over_omega = 4.0     # tiller natural frequency / field frequency
zeta = 0.5                   # tiller damping ratio
v = 1.5                      # boat speed, length units / s
steps_per_second = 480       # dt = 1 / steps_per_second
phi_deg = 0.0                # field axis
field_ellipticity = 0.0      # 0: oscillating field along the axis; +-1: rotating field
stop_ratio = 1.3             # soft stops at +- stop_ratio * alpha0
stop_stiffness_ratio = 0.0   # stop stiffness / k; 0 switches the stops off
