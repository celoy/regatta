# Candidate R (Phase 1 report, third pass): rotating field, where the press phase sets the
# heading. Stroke as in candidate A. Inertias normalised by I_m + I_h = 1.

field_hz = 1.0               # field frequency omega / (2 pi), Hz (one beat per period)
omega_over_omega0 = 2.0      # candidate R: weak enough that the field cannot carry the boat round
hull_damping = 3.0           # candidate R: near-critical damping of the slow heading motion
inertia_ratio = 0.2          # I_m / I_h
alpha0_deg = 65.0            # as candidate A: large stroke
omega_s_over_omega = 4.0     # tiller natural frequency / field frequency
zeta = 0.5                   # tiller damping ratio
v = 1.5                      # boat speed, length units / s
steps_per_second = 480       # dt = 1 / steps_per_second
phi_deg = 0.0                # field axis
field_ellipticity = 1.0      # candidate R: rotating field (two coil pairs in quadrature)
stop_ratio = 1.3             # soft stops at +- stop_ratio * alpha0
stop_stiffness_ratio = 0.0   # stop stiffness / k; 0 switches the stops off
